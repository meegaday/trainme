name: Release FitTrack APK

# 触发：
#   1) 手动：Actions → Release FitTrack APK → Run workflow → 填版本号（如 1.0.0）
#   2) 打 tag 推送：git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.0.0'
        required: true
        default: '1.0.0'

permissions:
  contents: write   # 需要写权限才能创建 Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps & sync web assets
        run: |
          npm install
          npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Stamp app versionName
        # 让 APK 内部版本号与发布版本一致（手机设置里能看到）
        run: |
          sed -i "s/versionName \".*\"/versionName \"${{ steps.ver.outputs.version }}\"/" android/app/build.gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Remove old release if re-run with same version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "v${{ steps.ver.outputs.version }}" --yes || true

      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            --title "FitTrack v${{ steps.ver.outputs.version }}" \
            --notes "调试版 APK（版本 ${{ steps.ver.outputs.version }}）。安装前请在手机开启「允许安装未知应用」。" \
            "android/app/build/outputs/apk/debug/app-debug.apk#FitTrack-v${{ steps.ver.outputs.version }}.apk"
